name: Update prices

on:
  schedule:
    # 22:30 UTC on weekdays = 5:30 p.m. Toronto (winter), after the US market closes
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch prices
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: node scripts/update.mjs
      - name: Commit data.json
        run: |
          git config user.name "stock-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update prices $(date -u +%Y-%m-%d)"
          git push
